# KK Coaching Admin Panel 2.0
# Content changes are committed to GitHub through Netlify Git Gateway.

local_backend: true

backend:
  name: git-gateway
  branch: main

media_folder: "public/images"
public_folder: "/images"
publish_mode: simple

collections:
  - name: "admin_v2"
    label: "Admin 2.0 — Strona"
    files:
      - label: "Treści globalne, Home, menu, stopka, mapa i opinie"
        name: "website"
        file: "src/data/admin-v2.json"
        fields:
          - label: "Marka / Brand"
            name: "brand"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Nazwa firmy", name: "siteName", widget: "string" }
              - { label: "Imię i nazwisko właściciela", name: "ownerName", widget: "string" }
              - { label: "Logo główne", name: "logo", widget: "image" }
              - { label: "Logo w stopce", name: "footerLogo", widget: "image" }
              - label: "Slogan"
                name: "tagline"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Polski", name: "pl", widget: "string" }
              - label: "Kwalifikacje / linia w stopce"
                name: "credentials"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Polski", name: "pl", widget: "string" }
              - label: "Opis zasięgu / lokalizacji"
                name: "locationSummary"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Polski", name: "pl", widget: "string" }

          - label: "Kontakt i social media"
            name: "contact"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Telefon", name: "phone", widget: "string", hint: "Najlepiej format międzynarodowy, np. +447..." }
              - { label: "WhatsApp", name: "whatsapp", widget: "string", hint: "Najlepiej format międzynarodowy, np. +447..." }
              - { label: "Instagram URL", name: "instagramUrl", widget: "string" }
              - { label: "Instagram — wyświetlana nazwa", name: "instagramLabel", widget: "string" }
              - { label: "Facebook URL", name: "facebookUrl", widget: "string", required: false }

          - label: "Menu i nagłówek"
            name: "header"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Sticky menu na telefonie", name: "stickyMobile", widget: "boolean", default: true }
              - { label: "Kompaktowy nagłówek po scrollu", name: "compactOnScroll", widget: "boolean", default: true }
              - { label: "Pokaż CTA w nagłówku desktop", name: "showHeaderCta", widget: "boolean", default: true }
              - label: "CTA nagłówka"
                name: "headerCta"
                widget: "object"
                fields:
                  - label: "Tekst"
                    name: "label"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Link"
                    name: "href"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
              - label: "Pozycje menu"
                name: "items"
                widget: "list"
                collapsed: true
                summary: "{{fields.label.en}} / {{fields.label.pl}}"
                hint: "Możesz dodawać, usuwać i przeciągać pozycje, aby zmienić kolejność."
                fields:
                  - { label: "ID techniczne", name: "id", widget: "string", hint: "Krótka unikalna nazwa bez spacji." }
                  - { label: "Widoczna", name: "enabled", widget: "boolean", default: true }
                  - label: "Wygląd"
                    name: "style"
                    widget: "select"
                    options:
                      - { label: "Zwykły link", value: "link" }
                      - { label: "Przycisk CTA", value: "cta" }
                    default: "link"
                  - label: "Nazwa"
                    name: "label"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Link"
                    name: "href"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }

          - label: "Stopka"
            name: "footer"
            widget: "object"
            collapsed: true
            fields:
              - label: "Nagłówki sekcji"
                name: "sectionLabels"
                widget: "object"
                fields:
                  - label: "Quick links"
                    name: "quickLinks"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Contact"
                    name: "contact"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Legal"
                    name: "legal"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Phone"
                    name: "phone"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "1:1 training"
                    name: "trainingAt"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Cookie settings"
                    name: "cookieSettings"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
              - label: "Linki na skróty"
                name: "quickLinks"
                widget: "list"
                collapsed: true
                summary: "{{fields.label.en}} / {{fields.label.pl}}"
                fields:
                  - { label: "Widoczny", name: "enabled", widget: "boolean", default: true }
                  - label: "Nazwa"
                    name: "label"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Link"
                    name: "href"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
              - label: "Linki prawne"
                name: "legalLinks"
                widget: "list"
                collapsed: true
                summary: "{{fields.label.en}} / {{fields.label.pl}}"
                fields:
                  - { label: "Widoczny", name: "enabled", widget: "boolean", default: true }
                  - label: "Nazwa"
                    name: "label"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Link"
                    name: "href"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
              - label: "Copyright"
                name: "copyright"
                widget: "object"
                hint: "Możesz użyć {year}, aby rok aktualizował się automatycznie."
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Polski", name: "pl", widget: "string" }
              - label: "Dolna linia SEO"
                name: "seoLine"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Polski", name: "pl", widget: "string" }

          - label: "Lokalizacja i mapa"
            name: "location"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Pokaż sekcję lokalizacji", name: "enabled", widget: "boolean", default: true }
              - { label: "Pokaż interaktywną mapę", name: "showInteractiveMap", widget: "boolean", default: true }
              - { label: "Nazwa miejsca", name: "venueName", widget: "string" }
              - { label: "Adres", name: "addressLine1", widget: "string" }
              - { label: "Miasto", name: "city", widget: "string" }
              - { label: "Kod pocztowy", name: "postcode", widget: "string" }
              - { label: "Kod kraju", name: "country", widget: "string", default: "GB" }
              - { label: "Google Maps — zapytanie/lokalizacja", name: "mapQuery", widget: "string" }
              - { label: "Link Wyznacz trasę (opcjonalny)", name: "directionsUrl", widget: "string", required: false, hint: "Puste = link zostanie zbudowany automatycznie z lokalizacji." }
              - label: "Teksty sekcji"
                name: "copy"
                widget: "object"
                fields:
                  - label: "Mały nagłówek"
                    name: "eyebrow"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Nagłówek"
                    name: "heading"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Opis"
                    name: "body"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "text" }
                      - { label: "Polski", name: "pl", widget: "text" }
                  - label: "Notatka o godzinach"
                    name: "note"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "text" }
                      - { label: "Polski", name: "pl", widget: "text" }
                  - label: "Przycisk wyznaczania trasy"
                    name: "directions"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Link do PT — zwykłe strony"
                    name: "serviceDefault"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Link CTA — strony usług lokalnych"
                    name: "serviceLanding"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Tytuł iframe mapy"
                    name: "mapTitle"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Nagłówek placeholdera mapy"
                    name: "mapHeading"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Opis mapy"
                    name: "mapInfo"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "text" }
                      - { label: "Polski", name: "pl", widget: "text" }
                  - label: "Przycisk ładowania mapy"
                    name: "mapLoad"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
              - label: "Atuty lokalizacji"
                name: "facts"
                widget: "list"
                collapsed: true
                summary: "{{fields.text.en}} / {{fields.text.pl}}"
                fields:
                  - { label: "Widoczny", name: "enabled", widget: "boolean", default: true }
                  - label: "Tekst"
                    name: "text"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }

          - label: "Opinie klientów"
            name: "reviews"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Pokaż sekcję opinii", name: "enabled", widget: "boolean", default: false, hint: "Włącz, kiedy dodasz pierwsze opinie." }
              - { label: "Ile opinii na Home", name: "homeLimit", widget: "number", value_type: "int", min: 1, max: 12, default: 4 }
              - label: "Mały nagłówek"
                name: "eyebrow"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Polski", name: "pl", widget: "string" }
              - label: "Nagłówek"
                name: "heading"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Polski", name: "pl", widget: "string" }
              - label: "Opis"
                name: "body"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "text" }
                  - { label: "Polski", name: "pl", widget: "text" }
              - label: "Tekst: pokaż screenshot"
                name: "screenshotLabel"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Polski", name: "pl", widget: "string" }
              - label: "Tekst: zobacz wszystkie opinie"
                name: "seeAllLabel"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Polski", name: "pl", widget: "string" }
              - label: "Tekst: dodaj opinię w Google"
                name: "leaveReviewLabel"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Polski", name: "pl", widget: "string" }
              - label: "Google — przygotowane pod przyszłe połączenie"
                name: "googleReviewsUrl"
                widget: "string"
                required: false
                hint: "Link do wszystkich opinii Google. Możesz zostawić pusty do czasu aktywacji GBP."
              - { label: "Google — link Dodaj opinię", name: "leaveGoogleReviewUrl", widget: "string", required: false }
              - { label: "Google Place ID (na przyszłość)", name: "googlePlaceId", widget: "string", required: false }
              - label: "Opinie"
                name: "items"
                widget: "list"
                collapsed: true
                summary: "{{fields.client}} — {{fields.source}}"
                hint: "Minimum pól: imię, treść i źródło. Screenshot i gwiazdki są opcjonalne."
                fields:
                  - { label: "Widoczna", name: "enabled", widget: "boolean", default: true }
                  - { label: "Imię klienta", name: "client", widget: "string" }
                  - { label: "Treść opinii", name: "quote", widget: "text" }
                  - label: "Źródło"
                    name: "source"
                    widget: "select"
                    options:
                      - { label: "Google", value: "google" }
                      - { label: "WhatsApp", value: "whatsapp" }
                      - { label: "Messenger", value: "messenger" }
                      - { label: "MyPTHub", value: "mypthub" }
                      - { label: "Instagram", value: "instagram" }
                      - { label: "Facebook", value: "facebook" }
                      - { label: "Email", value: "email" }
                      - { label: "Inne", value: "other" }
                  - { label: "Screenshot oryginalnej wiadomości", name: "screenshot", widget: "image", required: false, hint: "Przed publikacją usuń lub zasłoń prywatne dane, jeśli klient nie zgodził się na ich pokazanie." }
                  - { label: "Ocena 1–5", name: "rating", widget: "number", value_type: "int", min: 1, max: 5, required: false }
                  - { label: "Pokaż na stronie głównej", name: "featured", widget: "boolean", default: true }

          - label: "Strona główna / Home"
            name: "home"
            widget: "object"
            collapsed: true
            fields:
              - label: "SEO Home"
                name: "seo"
                widget: "object"
                fields:
                  - label: "SEO title"
                    name: "title"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Meta description"
                    name: "description"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "text" }
                      - { label: "Polski", name: "pl", widget: "text" }
              - label: "Hero"
                name: "hero"
                widget: "object"
                fields:
                  - label: "Nagłówek"
                    name: "heading"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Opis"
                    name: "lead"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "text" }
                      - { label: "Polski", name: "pl", widget: "text" }
                  - label: "Główne CTA"
                    name: "ctaPrimary"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Link głównego CTA"
                    name: "ctaPrimaryHref"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Drugie CTA"
                    name: "ctaSecondary"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Link drugiego CTA"
                    name: "ctaSecondaryHref"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Linia zaufania"
                    name: "trustLine"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - { label: "Zdjęcie", name: "image", widget: "image" }
                  - label: "Alt zdjęcia"
                    name: "imageAlt"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
              - label: "Dla kogo jest coaching"
                name: "whoItsFor"
                widget: "object"
                fields:
                  - label: "Mały nagłówek"
                    name: "eyebrow"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Nagłówek"
                    name: "heading"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Opis"
                    name: "body"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "text" }
                      - { label: "Polski", name: "pl", widget: "text" }
                  - label: "Karty"
                    name: "cards"
                    widget: "list"
                    collapsed: true
                    summary: "{{fields.title.en}} / {{fields.title.pl}}"
                    fields:
                      - label: "Tytuł"
                        name: "title"
                        widget: "object"
                        fields:
                          - { label: "English", name: "en", widget: "string" }
                          - { label: "Polski", name: "pl", widget: "string" }
                      - label: "Opis"
                        name: "body"
                        widget: "object"
                        fields:
                          - { label: "English", name: "en", widget: "text" }
                          - { label: "Polski", name: "pl", widget: "text" }
              - label: "Wprowadzenie do usług"
                name: "servicesIntro"
                widget: "object"
                fields:
                  - label: "Mały nagłówek"
                    name: "eyebrow"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Nagłówek"
                    name: "heading"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Opis"
                    name: "body"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "text" }
                      - { label: "Polski", name: "pl", widget: "text" }
              - label: "Historia trenera"
                name: "story"
                widget: "object"
                fields:
                  - label: "Mały nagłówek"
                    name: "eyebrow"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Nagłówek"
                    name: "heading"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Krótki opis"
                    name: "bodyShort"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "text" }
                      - { label: "Polski", name: "pl", widget: "text" }
                  - label: "Pełny opis"
                    name: "bodyFull"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "text" }
                      - { label: "Polski", name: "pl", widget: "text" }
                  - { label: "Zdjęcie", name: "image", widget: "image" }
                  - label: "Alt zdjęcia"
                    name: "imageAlt"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Statystyki"
                    name: "stats"
                    widget: "list"
                    collapsed: true
                    summary: "{{fields.value}}"
                    fields:
                      - { label: "Wartość", name: "value", widget: "string" }
                      - label: "Podpis"
                        name: "label"
                        widget: "object"
                        fields:
                          - { label: "English", name: "en", widget: "string" }
                          - { label: "Polski", name: "pl", widget: "string" }
                  - label: "CTA"
                    name: "cta"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Link CTA"
                    name: "ctaHref"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
              - label: "Proces"
                name: "process"
                widget: "object"
                fields:
                  - label: "Mały nagłówek"
                    name: "eyebrow"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Nagłówek"
                    name: "heading"
                    widget: "object"
                    fields:
