# Decap CMS configuration for KK Coaching.
# Content changes made here are committed to GitHub through Netlify Git Gateway.

local_backend: true

backend:
  name: git-gateway
  branch: main

media_folder: "public/images"
public_folder: "/images"
publish_mode: simple

collections:
  - name: "site_settings"
    label: "Site Settings"
    files:
      - label: "Site Copy (English)"
        name: "site_en"
        file: "src/data/site.en.json"
        fields:
          - label: "Contact & Brand"
            name: "meta"
            widget: "object"
            fields:
              - { label: "Site name", name: "siteName", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Contact email", name: "contactEmail", widget: "string" }
              - { label: "WhatsApp number", name: "whatsappNumber", widget: "string", hint: "Use international format, e.g. +447..." }
              - { label: "Instagram URL", name: "instagramUrl", widget: "string" }
              - { label: "Facebook URL", name: "facebookUrl", widget: "string", required: false }
              - { label: "Training location", name: "trainingLocation", widget: "string" }
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lead paragraph", name: "lead", widget: "text" }
              - { label: "Primary button text", name: "ctaPrimary", widget: "string" }
              - { label: "Secondary button text", name: "ctaSecondary", widget: "string" }
              - { label: "Trust line", name: "trustLine", widget: "string" }
              - { label: "Hero image", name: "image", widget: "image" }
              - { label: "Image alt text", name: "imageAlt", widget: "string" }
          - label: "Who this is for"
            name: "whoItsFor"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro paragraph", name: "body", widget: "text" }
              - label: "Cards"
                name: "cards"
                widget: "list"
                min: 4
                max: 4
                fields:
                  - { label: "Card title", name: "title", widget: "string" }
                  - { label: "Card text", name: "body", widget: "text" }
          - label: "Coaching options intro"
            name: "servicesIntro"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro paragraph", name: "body", widget: "text" }
          - label: "Coach Story"
            name: "story"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Short version (Home page)", name: "bodyShort", widget: "text" }
              - { label: "Full version (About page)", name: "bodyFull", widget: "text" }
              - { label: "Starting weight stat", name: "statStart", widget: "string" }
              - { label: "Weight loss stat", name: "statLoss", widget: "string" }
              - { label: "Qualification stat", name: "statQualification", widget: "string" }
              - { label: "Button text", name: "cta", widget: "string" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Image alt text", name: "imageAlt", widget: "string" }
          - label: "Process"
            name: "process"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro paragraph", name: "body", widget: "text" }
              - label: "Steps"
                name: "steps"
                widget: "list"
                min: 4
                max: 4
                fields:
                  - { label: "Step title", name: "title", widget: "string" }
                  - { label: "Step text", name: "body", widget: "text" }
          - label: "Transformations intro"
            name: "transformations"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro paragraph", name: "body", widget: "text" }
              - { label: "Button text", name: "cta", widget: "string" }
          - label: "Final CTA"
            name: "finalCta"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Text", name: "body", widget: "text" }
              - { label: "Button text", name: "cta", widget: "string" }

      - label: "Site Copy (Polish)"
        name: "site_pl"
        file: "src/data/site.pl.json"
        fields:
          - label: "Kontakt i marka"
            name: "meta"
            widget: "object"
            fields:
              - { label: "Nazwa strony", name: "siteName", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Email kontaktowy", name: "contactEmail", widget: "string" }
              - { label: "Numer WhatsApp", name: "whatsappNumber", widget: "string", hint: "Format międzynarodowy, np. +447..." }
              - { label: "Instagram URL", name: "instagramUrl", widget: "string" }
              - { label: "Facebook URL", name: "facebookUrl", widget: "string", required: false }
              - { label: "Lokalizacja treningów", name: "trainingLocation", widget: "string" }
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Nagłówek", name: "heading", widget: "string" }
              - { label: "Wprowadzenie", name: "lead", widget: "text" }
              - { label: "Tekst głównego przycisku", name: "ctaPrimary", widget: "string" }
              - { label: "Tekst drugiego przycisku", name: "ctaSecondary", widget: "string" }
              - { label: "Linia zaufania", name: "trustLine", widget: "string" }
              - { label: "Zdjęcie hero", name: "image", widget: "image" }
              - { label: "Tekst alternatywny", name: "imageAlt", widget: "string" }
          - label: "Dla kogo jest coaching"
            name: "whoItsFor"
            widget: "object"
            fields:
              - { label: "Mały nagłówek", name: "eyebrow", widget: "string" }
              - { label: "Nagłówek", name: "heading", widget: "string" }
              - { label: "Wprowadzenie", name: "body", widget: "text" }
              - label: "Karty"
                name: "cards"
                widget: "list"
                min: 4
                max: 4
                fields:
                  - { label: "Tytuł karty", name: "title", widget: "string" }
                  - { label: "Treść karty", name: "body", widget: "text" }
          - label: "Wprowadzenie do form współpracy"
            name: "servicesIntro"
            widget: "object"
            fields:
              - { label: "Mały nagłówek", name: "eyebrow", widget: "string" }
              - { label: "Nagłówek", name: "heading", widget: "string" }
              - { label: "Wprowadzenie", name: "body", widget: "text" }
          - label: "Historia trenera"
            name: "story"
            widget: "object"
            fields:
              - { label: "Mały nagłówek", name: "eyebrow", widget: "string" }
              - { label: "Nagłówek", name: "heading", widget: "string" }
              - { label: "Krótka wersja (strona główna)", name: "bodyShort", widget: "text" }
              - { label: "Pełna wersja (O mnie)", name: "bodyFull", widget: "text" }
              - { label: "Masa startowa", name: "statStart", widget: "string" }
              - { label: "Redukcja masy", name: "statLoss", widget: "string" }
              - { label: "Kwalifikacja / oferta", name: "statQualification", widget: "string" }
              - { label: "Tekst przycisku", name: "cta", widget: "string" }
              - { label: "Zdjęcie", name: "image", widget: "image" }
              - { label: "Tekst alternatywny", name: "imageAlt", widget: "string" }
          - label: "Proces"
            name: "process"
            widget: "object"
            fields:
              - { label: "Mały nagłówek", name: "eyebrow", widget: "string" }
              - { label: "Nagłówek", name: "heading", widget: "string" }
              - { label: "Wprowadzenie", name: "body", widget: "text" }
              - label: "Kroki"
                name: "steps"
                widget: "list"
                min: 4
                max: 4
                fields:
                  - { label: "Tytuł kroku", name: "title", widget: "string" }
                  - { label: "Treść kroku", name: "body", widget: "text" }
          - label: "Wprowadzenie do przemian"
            name: "transformations"
            widget: "object"
            fields:
              - { label: "Mały nagłówek", name: "eyebrow", widget: "string" }
              - { label: "Nagłówek", name: "heading", widget: "string" }
              - { label: "Wprowadzenie", name: "body", widget: "text" }
              - { label: "Tekst przycisku", name: "cta", widget: "string" }
          - label: "Końcowe CTA"
            name: "finalCta"
            widget: "object"
            fields:
              - { label: "Nagłówek", name: "heading", widget: "string" }
              - { label: "Treść", name: "body", widget: "text" }
              - { label: "Tekst przycisku", name: "cta", widget: "string" }

  - name: "pricing_settings"
    label: "Ceny i pakiety / Pricing"
    files:
      - label: "Ceny, pakiety i wyróżnienia"
        name: "pricing"
        file: "src/data/pricing.json"
        fields:
          - { label: "Symbol waluty", name: "currency", widget: "string", default: "£" }
          - label: "Etykiety / Labels"
            name: "labels"
            widget: "object"
            fields:
              - label: "Najlepszy wybór / Best value"
                name: "bestValue"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Polski", name: "pl", widget: "string" }
              - label: "Od / From"
                name: "from"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Polski", name: "pl", widget: "string" }
              - label: "Za trening / Per session"
                name: "perSession"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Polski", name: "pl", widget: "string" }
              - label: "Jednorazowo / One-off"
                name: "oneOff"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Polski", name: "pl", widget: "string" }

          - label: "Personal Training 1:1"
            name: "personal"
            widget: "object"
            fields:
              - label: "Teksty sekcji cennika"
                name: "section"
                widget: "object"
                fields:
                  - label: "Mały nagłówek"
                    name: "eyebrow"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Nagłówek"
                    name: "heading"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Wprowadzenie"
                    name: "intro"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "text" }
                      - { label: "Polski", name: "pl", widget: "text" }
                  - label: "Notatka pod cennikiem"
                    name: "note"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "text" }
                      - { label: "Polski", name: "pl", widget: "text" }
                  - label: "Przycisk CTA"
                    name: "cta"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
              - label: "Pojedynczy trening / Pay as you go"
                name: "payg"
                widget: "object"
                fields:
                  - { label: "Aktywny", name: "enabled", widget: "boolean" }
                  - label: "Nazwa"
                    name: "name"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - { label: "Cena £", name: "price", widget: "number", value_type: "float", min: 0 }
                  - { label: "Długość treningu (min)", name: "sessionMinutes", widget: "number", value_type: "int", min: 1 }
                  - { label: "Pokaż jako Najlepszy wybór", name: "featured", widget: "boolean", default: false }
              - label: "Pakiety 1:1"
                name: "packages"
                widget: "list"
                summary: "{{fields.id}} — £{{fields.price}}"
                fields:
                  - { label: "ID", name: "id", widget: "string", hint: "Techniczny identyfikator, np. weekly1" }
                  - { label: "Aktywny", name: "enabled", widget: "boolean" }
                  - label: "Nazwa"
                    name: "name"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - { label: "Cena pakietu £", name: "price", widget: "number", value_type: "float", min: 0 }
                  - { label: "Liczba tygodni", name: "weeks", widget: "number", value_type: "int", min: 1 }
                  - { label: "Liczba treningów", name: "sessions", widget: "number", value_type: "int", min: 1 }
                  - { label: "Pokaż jako Najlepszy wybór", name: "featured", widget: "boolean", default: false }

          - label: "Online Coaching"
            name: "online"
            widget: "object"
            fields:
              - label: "Teksty sekcji cennika"
                name: "section"
                widget: "object"
                fields:
                  - label: "Mały nagłówek"
                    name: "eyebrow"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Nagłówek"
                    name: "heading"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Wprowadzenie"
                    name: "intro"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "text" }
                      - { label: "Polski", name: "pl", widget: "text" }
                  - label: "Notatka pod cennikiem"
                    name: "note"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "text" }
                      - { label: "Polski", name: "pl", widget: "text" }
                  - label: "Przycisk CTA"
                    name: "cta"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
              - { label: "Aktywny", name: "enabled", widget: "boolean" }
              - label: "Nazwa"
                name: "name"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Polski", name: "pl", widget: "string" }
              - { label: "Cena £", name: "price", widget: "number", value_type: "float", min: 0 }
              - { label: "Płatność co ile tygodni", name: "billingWeeks", widget: "number", value_type: "int", min: 1 }
              - { label: "Minimalny okres współpracy (tygodnie)", name: "minimumWeeks", widget: "number", value_type: "int", min: 1 }
              - { label: "Pokaż jako Najlepszy wybór", name: "featured", widget: "boolean", default: false }

          - label: "Hybrid Coaching"
            name: "hybrid"
            widget: "object"
            fields:
              - label: "Teksty sekcji cennika"
                name: "section"
                widget: "object"
                fields:
                  - label: "Mały nagłówek"
                    name: "eyebrow"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Nagłówek"
                    name: "heading"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - label: "Wprowadzenie"
                    name: "intro"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "text" }
                      - { label: "Polski", name: "pl", widget: "text" }
                  - label: "Notatka pod cennikiem"
                    name: "note"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "text" }
                      - { label: "Polski", name: "pl", widget: "text" }
                  - label: "Przycisk CTA"
                    name: "cta"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
              - { label: "Wyróżnij Hybrid na kartach usług", name: "homeBadgeEnabled", widget: "boolean" }
              - label: "Etykieta wyróżnienia Hybrid"
                name: "homeBadge"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Polski", name: "pl", widget: "string" }
              - label: "Pakiety Hybrid"
                name: "packages"
                widget: "list"
                summary: "{{fields.id}} — £{{fields.price}}"
                fields:
                  - { label: "ID", name: "id", widget: "string", hint: "Techniczny identyfikator, np. weekly1" }
                  - { label: "Aktywny", name: "enabled", widget: "boolean" }
                  - label: "Nazwa"
                    name: "name"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Polski", name: "pl", widget: "string" }
                  - { label: "Cena pakietu £", name: "price", widget: "number", value_type: "float", min: 0 }
                  - { label: "Liczba tygodni", name: "weeks", widget: "number", value_type: "int", min: 1 }
                  - { label: "Liczba treningów 1:1", name: "sessions", widget: "number", value_type: "int", min: 1 }
                  - { label: "Pokaż jako Najlepszy wybór", name: "featured", widget: "boolean", default: false }

          - label: "Indywidualny plan treningowy"
            name: "trainingPlan"
            widget: "object"
            fields:
              - { label: "Aktywny", name: "enabled", widget: "boolean" }
              - { label: "Cena jednorazowa £", name: "price", widget: "number", value_type: "float", min: 0 }

  - name: "services_en"
    label: "Services (English)"
    folder: "src/content/services/en"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Tagline", name: "tagline", widget: "text" }
      - { label: "Display order", name: "order", widget: "number" }
      - { label: "De-emphasise this card", name: "minor", widget: "boolean", default: false }
      - { label: "Button text", name: "ctaLabel", widget: "string" }
      - { label: "Button link", name: "ctaTarget", widget: "string", default: "/contact" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Image alt text", name: "imageAlt", widget: "string" }
      - { label: "Bullet points", name: "bullets", widget: "list" }

  - name: "services_pl"
    label: "Usługi (Polski)"
    folder: "src/content/services/pl"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Tytuł", name: "title", widget: "string" }
      - { label: "Opis", name: "tagline", widget: "text" }
      - { label: "Kolejność wyświetlania", name: "order", widget: "number" }
      - { label: "Pomniejsz tę kartę", name: "minor", widget: "boolean", default: false }
      - { label: "Tekst przycisku", name: "ctaLabel", widget: "string" }
      - { label: "Link przycisku", name: "ctaTarget", widget: "string", default: "/pl/contact" }
      - { label: "Zdjęcie", name: "image", widget: "image" }
      - { label: "Tekst alternatywny", name: "imageAlt", widget: "string" }
      - { label: "Punkty", name: "bullets", widget: "list" }

  - name: "testimonials"
    label: "Transformations"
    folder: "src/content/testimonials"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Client name / initial (EN)", name: "name", widget: "string" }
      - { label: "Client name / initial (PL)", name: "namePl", widget: "string", required: false }
      - { label: "Age disclosed?", name: "ageDisclosed", widget: "boolean", default: false }
      - { label: "Age", name: "age", widget: "number", required: false }
      - { label: "Service type (EN)", name: "serviceType", widget: "string" }
      - { label: "Service type (PL)", name: "serviceTypePl", widget: "string", required: false }
      - { label: "Duration (EN)", name: "duration", widget: "string" }
      - { label: "Duration (PL)", name: "durationPl", widget: "string", required: false }
      - { label: "Starting point (EN)", name: "startingPoint", widget: "string" }
      - { label: "Starting point (PL)", name: "startingPointPl", widget: "string", required: false }
      - { label: "Result (EN)", name: "result", widget: "string" }
      - { label: "Result (PL)", name: "resultPl", widget: "string", required: false }
      - label: "Written consent on file?"
        name: "consentOnFile"
        widget: "boolean"
        default: false
        hint: "Only enable this once you have permission to publish the client's details/photo."
      - { label: "Photo", name: "image", widget: "image" }
      - { label: "Photo alt text (EN)", name: "imageAlt", widget: "string" }
      - { label: "Photo alt text (PL)", name: "imageAltPl", widget: "string", required: false }
      - { label: "Feature on Home page", name: "featured", widget: "boolean", default: false }
      - { label: "Client story / quote (EN)", name: "body", widget: "markdown" }
      - { label: "Client story / quote (PL)", name: "storyPl", widget: "text", required: false }

  - name: "faq"
    label: "FAQ"
    folder: "src/content/faq"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Question", name: "question", widget: "string" }
      - { label: "Display order", name: "order", widget: "number" }
      - label: "Language"
        name: "language"
        widget: "select"
        options:
          - { label: "English", value: "en" }
          - { label: "Polski", value: "pl" }
        default: "en"
      - { label: "Answer", name: "body", widget: "markdown" }
