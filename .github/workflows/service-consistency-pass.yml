name: Service page consistency pass

on:
  push:
    paths:
      - 'scripts/service-consistency-pass.mjs'
      - '.github/workflows/service-consistency-pass.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply consistency pass
        run: node scripts/service-consistency-pass.mjs

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/service-details-v2.json src/data/online-v2.json src/data/hybrid-v2.json src/data/pricing.json src/pages/personal-training-cwmbran.astro src/pages/pl/personal-training-cwmbran.astro src/pages/online-coaching.astro src/pages/pl/online-coaching.astro src/pages/hybrid-coaching.astro src/pages/pl/hybrid-coaching.astro
          git commit -m "Unify service page hero and sales copy"
          git push
