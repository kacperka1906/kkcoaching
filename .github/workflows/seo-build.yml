name: Build, SEO and deployed performance audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and run SEO audit
        run: npm run build

      - name: Wait for Netlify production deployment
        run: |
          for i in {1..60}; do
            body="$(curl -fsSL --max-time 20 https://kkcoaching.fit/training-plan || true)"
            if printf '%s' "$body" | grep -q "Personalised Training Plan Built Around You"; then
              echo "Production deployment is ready."
              exit 0
            fi
            echo "Waiting for production deployment ($i/60)..."
            sleep 5
          done
          echo "Production deployment did not expose the expected training-plan page in time."
          exit 1

      - name: Production HTTP smoke test
        run: |
          routes=("/" "/personal-training-cwmbran" "/online-coaching" "/hybrid-coaching" "/training-plan")
          for path in "${routes[@]}"; do
            code="$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 30 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36' "https://kkcoaching.fit${path}")"
            echo "${path} -> ${code}"
            test "$code" = "200"
          done

      - name: Run Lighthouse mobile and desktop against production
        run: |
          mkdir -p lighthouse-reports
          UA='Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 Chrome/140.0.0.0 Mobile Safari/537.36'
          routes=("home:/" "personal-training:/personal-training-cwmbran" "online-coaching:/online-coaching" "hybrid-coaching:/hybrid-coaching" "training-plan:/training-plan")
          for entry in "${routes[@]}"; do
            name="${entry%%:*}"
            path="${entry#*:}"
            npx --yes lighthouse@12.6.0 "https://kkcoaching.fit${path}" \
              --quiet \
              --user-agent="$UA" \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json \
              --output-path="lighthouse-reports/${name}-mobile.json"
            npx --yes lighthouse@12.6.0 "https://kkcoaching.fit${path}" \
              --quiet \
              --preset=desktop \
              --user-agent="$UA" \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json \
              --output-path="lighthouse-reports/${name}-desktop.json"
          done

      - name: Summarize Lighthouse results
        run: node scripts/lighthouse-summary.mjs
