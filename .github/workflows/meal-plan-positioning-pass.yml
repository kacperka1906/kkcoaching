name: Meal plan positioning pass

on:
  push:
    paths:
      - 'scripts/meal-plan-positioning-pass.mjs'
      - '.github/workflows/meal-plan-positioning-pass.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply meal plan positioning pass
        run: node scripts/meal-plan-positioning-pass.mjs

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/services-v2.json src/data/online-v2.json src/data/hybrid-v2.json src/data/pricing.json src/data/admin-v2.json
          git commit -m "Clarify personalised meal plans in online and hybrid coaching"
          git push
