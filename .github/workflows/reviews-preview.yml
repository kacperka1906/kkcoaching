name: Reviews preview checks
on:
  pull_request:
    branches: [homepage-reviews-placement-preview]
permissions:
  contents: read
jobs:
  reviews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/test-reviews-widget.mjs
      - run: node --test scripts/test-reviews-sync.mjs
