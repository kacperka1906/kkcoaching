name: Fix Online Promotion Pricing Layout

on:
  push:
    branches:
      - fix/online-promo-pricing-layout
    paths:
      - 'scripts/fix-online-promo-layout.mjs'
      - '.github/workflows/fix-online-promo-layout.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/online-promo-pricing-layout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply layout fix
        run: node scripts/fix-online-promo-layout.mjs
      - name: Build and audits
        run: npm run build
      - name: Assert sibling order and correct light pricing heading
        run: |
          python - <<'PY'
          from pathlib import Path
          for file in ['dist/online-coaching/index.html','dist/pl/online-coaching/index.html']:
              html=Path(file).read_text()
              hero=html.index('<section class="online-hero')
              promo=html.index('<section class="online-promotion')
              pricing=html.index('<section class="service-pricing')
              assert hero < promo < pricing, (file, hero, promo, pricing)
              hero_end=html.index('</section>', hero)
              assert hero_end < promo, f'Promotion still nested in hero: {file}'
          print('Hero -> Promotion -> Pricing order verified in EN and PL.')
          PY
      - name: Capture corrected desktop/mobile screenshots
        run: |
          mkdir -p qa
          npm run preview -- --host 127.0.0.1 > /tmp/preview.log 2>&1 &
          PID=$!
          sleep 5
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,2400 --force-device-scale-factor=1 --screenshot=qa/en-mobile.png http://127.0.0.1:4321/online-coaching/
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,2400 --force-device-scale-factor=1 --screenshot=qa/pl-mobile.png http://127.0.0.1:4321/pl/online-coaching/
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1900 --screenshot=qa/en-desktop.png http://127.0.0.1:4321/online-coaching/
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1900 --screenshot=qa/pl-desktop.png http://127.0.0.1:4321/pl/online-coaching/
          kill $PID || true
      - uses: actions/upload-artifact@v4
        with:
          name: online-promo-layout-fix-qa
          path: qa/*.png
          retention-days: 7
      - name: Commit fix and remove one-time tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/online-coaching.astro src/pages/pl/online-coaching.astro scripts/finalize-static-html.mjs
          git rm scripts/fix-online-promo-layout.mjs .github/workflows/fix-online-promo-layout.yml
          git commit -m "Keep Online promotion and pricing as separate sections"
          git push origin fix/online-promo-pricing-layout
