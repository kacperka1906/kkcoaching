[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[redirects]]
  from = "/images/photo-collage.png-1-.png"
  to = "/.netlify/images?url=/images/photo-collage-source.png&w=820&q=82"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
