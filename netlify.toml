[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[redirects]]
  from = "/images/about-kacper-edge.jpg"
  to = "/.netlify/images?url=/images/about-kacper.webp&w=800&h=800&fit=cover&fm=jpg&q=88"
  status = 200
  force = true

[[redirects]]
  from = "/images/kacper-hero.webp"
  to = "/.netlify/images?url=/images/kacper.jpg&w=960&fm=webp&q=84"
