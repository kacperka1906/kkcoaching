[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[redirects]]
  from = "/images/about-kacper-edge.jpg"
  to = "/.netlify/images?url=/images/about-kacper.webp&w=800&h=800&fit=cover&fm=jpg&q=88"
  status = 200
  force = true

[[redirects]]
  from = "/images/kacper-hero.webp"
  to = "/.netlify/images?url=/images/kacper.jpg&w=960&fm=webp&q=84"
  status = 200
  force = true

[[redirects]]
  from = "/images/kacper-story.webp"
  to = "/.netlify/images?url=/images/19286.jpg&w=700&h=700&fit=cover&fm=webp&q=84"
  status = 200
  force = true

# Legacy service visuals now resolve to the approved production artwork.
[[redirects]]
  from = "/images/kacper.png"
  to = "/images/personal-training-cwmbran.webp"
  status = 301
  force = true

[[redirects]]
  from = "/images/personal-training-cwmbran-placeholder.svg"
  to = "/images/personal-training-cwmbran.webp"
  status = 301
  force = true

[[redirects]]
  from = "/images/online-coaching-placeholder.svg"
  to = "/images/online-coaching-app.webp"
  status = 301
  force = true

[[redirects]]
  from = "/images/hybrid-coaching-placeholder.svg"
  to = "/images/hybrid-coaching.webp"
  status = 301
  force = true

[[redirects]]
  from = "/images/photo-collage.png-1-.png"
  to = "/.netlify/images?url=/images/photo-collage-source.png&w=820&fm=webp&q=82"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
  force = true

# Single canonical vanity URL for the QR code printed on JD Gyms Cwmbran materials.
# Only /jd/ is published/used. It is intentionally excluded from the sitemap and
# internal navigation; the destination can change later without replacing the QR.
[[redirects]]
  from = "/jd/"
  to = "/personal-training-cwmbran/?utm_source=jd_gyms_cwmbran&utm_medium=qr&utm_campaign=jd_banner"
  status = 302
  force = true

# Resources visibility is controlled by Admin 2.0 at build time.
# Do not add permanent redirects for /resources here: when OFF, the build
# removes those routes; when ON, the same URLs must be publishable again.

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
